#:schema https://json.schemastore.org/pyproject.json

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[dependency-groups]
build = ["pyinstaller-versionfile>=3.0.0"]
lint = ["pyright>=1.1.394", "ruff>=0.9.6"]

[project]
name = "simple-resume"
version = "1.0.0"
description = "CLI tool to build a resume using a JSON Resume file"
authors = [{ name = "Sebastián Altamirano" }]
dependencies = [
	"Babel>=2.17.0",
	"Flask>=3.1.0",
	"email-validator>=2.2.0",
	"jinjax[whitenoise]>=0.48",
	"livereload>=2.7.1",
	"playwright>=1.50.0",
	"pydantic>=2.10.6",
	"pydantic-extra-types[phonenumbers,pycountry,semver]>=2.10.2",
	"pyinstaller>=6.12.0",
	"requests>=2.32.3",
	"tldextract>=5.1.3",
	"typer>=0.15.1",
]
requires-python = "==3.12.*"
readme = "README.md"
license = { text = "MIT" }

[project.scripts]
simple-resume = "simple_resume.__main__:app"

[tool.pdm]
distribution = true

[tool.pdm.scripts]
_extract-messages = """pybabel extract simple_resume
	--add-location file
	--mapping-file simple_resume/translations/babel.cfg
	--omit-header
	--output-file simple_resume/translations/messages.pot
	--sort-output
	--width 100
"""
_update-messages = """pybabel update
	--ignore-obsolete
	--input-file simple_resume/translations/messages.pot
	--omit-header
	--output-dir simple_resume/translations
	--width 100
"""
update-messages.composite = ["_extract-messages", "_update-messages"]
initialize-messages.composite = [
	"_extract-messages",
	"mkdir -p simple_resume/translations/{args}/LC_MESSAGES",
	"_update-messages --init-missing --locale {args}",
]
# `--use-fuzzy` is necessary because `.po` files without headers are marked as fuzzy.
# https://github.com/python-babel/babel/issues/688
compile-messages = "pybabel compile --directory simple_resume/translations --use-fuzzy"
format.composite = [
	"ruff check --select I --fix",             # Sort imports
	"ruff format",
	"npx prettier --write --ignore-unknown .",
]
lint.composite = ["ruff check", "pyright"]
lint.env.PYRIGHT_PYTHON_PYLANCE_VERSION = "latest-release"
frontman = "./scripts/run_frontman.sh"
build-pyinstaller.composite = [
	"compile-messages",
	"frontman install",
	"pyinstaller app.spec --noconfirm",
]
pack-pyinstaller-linux = "tar -czf dist/simple_resume.tar.gz -C dist/simple_resume ."
pack-pyinstaller-windows = """Compress-Archive
	-DestinationPath dist/simple_resume.zip
	-Force
	-Path dist/simple_resume/*
"""
# Hooks
post_install = { composite = ["compile-messages", "frontman install"] }
pre_build = { composite = ["compile-messages"] }

[tool.pyright]
include = ["simple_resume"]
pythonPlatform = "All"
typeCheckingMode = "strict"

[tool.ruff]
indent-width = 4
line-length = 100
src = ["simple_resume"]

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
ignore = ["D107", "ISC001"]
select = [
	"A",
	"ANN",
	"ARG",
	"ASYNC",
	"B",
	"BLE",
	"C4",
	"C90",
	"D",
	"DTZ",
	"E",
	"EM",
	"ERA",
	"F",
	"FA",
	"FBT",
	"FIX",
	"FURB",
	"I",
	"ICN",
	"INP",
	"INT",
	"ISC",
	"N",
	"PERF",
	"PIE",
	"PLC",
	"PLE",
	"PLR",
	"PLW",
	"PTH",
	"Q",
	"RET",
	"RUF",
	"SIM",
	"SLF",
	"SLOT",
	"T10",
	"T20",
	"TID",
	"TRY",
	"UP",
	"W",
	"YTT",
]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.pydocstyle]
convention = "google"
